
<div
  id="cookieBanner"
  class="cookie-banner"
  role="dialog"
  aria-modal="false"
  aria-labelledby="cookie-title"
  aria-describedby="cookie-description"
>

  <h3 id="cookie-title">Cookie preferences</h3>

  <p id="cookie-description">
    We use essential cookies for website functionality.
    With your permission, we also use analytics cookies
    to understand how visitors use our website.
    You can accept or reject optional analytics cookies.
  </p>

  <div class="cookie-actions">

    <button
      type="button"
      class="btn btn-outline"
      data-cookie-reject
    >
      Reject analytics
    </button>

    <button
      type="button"
      class="btn btn-primary"
      data-cookie-accept
    >
      Accept analytics
    </button>

  </div>

</div>
